<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бродяга · Модельная мастерская</title><link rel="stylesheet" href="style.css">
<header><div class="brand">БРОДЯГА <small>Модельная мастерская</small></div><nav><a href="./">К мастерской</a><button id="open">Открыть проект</button><button id="save">Сохранить проект</button><button id="export" class="gold">Экспорт GLB ↓</button></nav></header>
