<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Атлас интербеллума</title><style>
*{box-sizing:border-box}body{margin:0;background:#efe2c8;color:#2d322e;font:16px Georgia,serif}header{background:#20343a;color:#f4e4c0;padding:18px 5%;border-bottom:4px solid #b7995e}header h1{font-size:clamp(24px,4vw,38px);margin:0}nav{display:flex;gap:5px;flex-wrap:wrap;padding:14px 5%;border-bottom:1px solid #b5a887}button,input{font:14px system-ui;padding:7px 10px;border:1px solid #998d71;background:#f5eddd;color:#24332e;border-radius:3px}button{cursor:pointer}button[aria-pressed=true]{background:#334841;color:white}main{display:grid;grid-template-columns:minmax(180px,32%) 1fr;gap:26px;margin:20px 5%}aside{display:flex;flex-direction:column;gap:5px}aside button{text-align:left}article{min-width:0}article h2{font-size:clamp(24px,3vw,36px);margin:.25em 0}p{line-height:1.55}small{color:#535951;font:12px system-ui}article img{max-width:100%;max-height:250px;margin:.6em 0;object-fit:contain}a{color:#245758}#close{float:right}input{min-width:140px;flex:1}.tag{font:12px ui-monospace,monospace;text-transform:uppercase;color:#79562f}aside{max-height:62vh;overflow:auto}@media(max-width:580px){main{display:block}aside{max-height:145px;margin-bottom:18px}}
figure{margin:1rem 0 1.4rem}figure>a{display:block;background:#e3d6ba;border:1px solid #ad9c79;text-align:center;cursor:zoom-in}article figure img{display:block;width:100%;max-height:460px;margin:0;object-fit:contain}figcaption{padding:.5em 0;font:14px/1.45 system-ui;color:#45483c}figcaption small{display:block;margin-top:.25em}
</style><header><button id="close">Закрыть</button><h1>Атлас интербеллума</h1><p style="margin:.35em 0 0">Европа между двумя мировыми войнами · 1918–1939</p></header><nav id="filters"><input type="search" id="query" placeholder="Поиск по атласу" aria-label="Поиск"></nav><main><aside id="list"></aside><article id="article"></article></main><script type="module">
import {references} from './references.js';
const workshop=new URLSearchParams(location.search).has('studio'),filters=document.querySelector('#filters'),query=document.querySelector('#query'),list=document.querySelector('#list'),article=document.querySelector('#article');
const el=(tag,text)=>{const n=document.createElement(tag);n.textContent=text??'';return n;};let category='Техника эпохи',active=0;
function closeBook(){if(parent!==window)parent.postMessage('nomad:close-atlas',location.origin);else if(workshop)location.href='../../workshop/';else location.href='../../';}
document.querySelector('#close').onclick=closeBook;window.addEventListener('keydown',e=>{if(e.key==='Escape')closeBook();});
function displayMedia(record){
  const items=record.gallery || (record.image ? [{file:record.image,caption:record.title+' · '+record.date}] : []);
  let figureCount=0;
  for(const item of items){
    const figure=el('figure'),link=el('a'),img=el('img'),caption=el('figcaption',item.caption);
    link.href='../../assets/encyclopedia/'+item.file;
    link.target='_blank';link.rel='noopener';link.title='Открыть изображение в полном размере';
    img.src=link.href;img.alt=item.caption;img.decoding='async';
    if(figureCount++)img.loading='lazy';
    link.append(img);figure.append(link,caption);
    if(item.source){
      const byline=el('small'),credit=el('a',item.credit || 'Источник');
      credit.href=item.source;credit.target='_blank';credit.rel='noopener';byline.append(credit);
      if(item.license){
        byline.append(' · ');
        if(item.licenseUrl){
          const license=el('a',item.license);license.href=item.licenseUrl;license.target='_blank';license.rel='noopener';byline.append(license);
        }else byline.append(item.license);
      }
      caption.append(byline);
    }
    article.append(figure);
  }
}

function render(){const ids=references.map((r,i)=>i).filter(i=>{const r=references[i];return (category==='Все'||r.category===category||category==='Техника эпохи'&&['Техника','Авиация','Корабли'].includes(r.category))&&[r.category,r.title,r.date,r.source,r.article,workshop?r.note:''].join(' ').toLocaleLowerCase('ru').includes(query.value.toLocaleLowerCase('ru'));});if(!ids.includes(active))active=ids[0];list.replaceChildren();article.replaceChildren();for(const i of ids){const b=el('button',references[i].title);b.setAttribute('aria-pressed',i===active);b.onclick=()=>{active=i;render()};list.append(b);}for(const b of filters.querySelectorAll('button'))b.setAttribute('aria-pressed',b.textContent===category);if(active===undefined){article.textContent='Совпадений нет';return;}const {category:cat,title,date,source,note,url,rights,article:body,image}=references[active],tag=el('div',cat+' · '+date);tag.className='tag';article.append(tag,el('h2',title));displayMedia(references[active]);article.append(el('p',body));for(const paragraph of references[active].paragraphs||[])article.append(el('p',paragraph));if(workshop)article.append(el('h3','Для «Бродяги»'),el('p',note));const a=el('a',source+' ↗');a.href=url;a.target='_blank';a.rel='noopener noreferrer';article.append(el('p'));article.lastChild.append(a);if(rights)article.append(el('small',rights));}
for(const cat of ['Техника эпохи','Об эпохе','Авиация','Корабли','Техника','Архитектура','Литература','Все']){const b=el('button',cat);b.onclick=()=>{category=cat;render()};filters.append(b);}query.oninput=render;render();
</script></html>
